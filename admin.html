<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة | GLOBAL ENERGY</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#101827;color:#fff;font-family:Tahoma,Arial,sans-serif;line-height:1.8}
main{width:min(100%,620px);background:#1c2b40;border:1px solid #30445c;border-radius:16px;padding:26px}
h1{color:#35c9a0;font-size:23px;margin:0 0 8px}p{color:#d0d9e5}.notice{padding:14px;border-radius:9px;background:#352f1d;color:#f4d58a;margin:18px 0}
a,button{display:inline-block;margin:6px 4px 0 0;padding:11px 17px;border-radius:8px;border:1px solid #35c9a0;background:#35c9a0;color:#10202a;text-decoration:none;font:inherit;font-weight:bold;cursor:pointer}
.secondary{background:transparent;color:#35c9a0}#status{color:#c5cfdd;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<h1>GLOBAL ENERGY & TECHNOLOGY</h1>
<h2>لوحة الإدارة</h2>
<p id="status">جارٍ التحقق من جلسة الدخول…</p>
<div class="notice" id="notice">الوصول الإداري متوقف مؤقتاً إلى أن نكمل التحقق من دور Founder/Administrator وسياسات قاعدة البيانات. تسجيل الدخول وحده لا يمنح صلاحية الإدارة.</div>
<div>
<a href="login.html" id="loginLink">تسجيل الدخول</a>
<a href="index.html" class="secondary">الصفحة الرئيسية</a>
<button id="logoutButton" class="secondary" hidden>تسجيل الخروج</button>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=window.supabase.createClient(
 "https://dagjfsqnfrzcmtjqmypy.supabase.co",
 "sb_publishable_Ca6rTp5OS9IxNJ0jnnaYvQ_lNRanlDK"
);
const statusEl=document.getElementById("status");
const loginLink=document.getElementById("loginLink");
const logoutButton=document.getElementById("logoutButton");
async function checkSession(){
 const {data,error}=await client.auth.getSession();
 if(error){statusEl.textContent="تعذر التحقق من جلسة الدخول. حدّث الصفحة أو حاول لاحقاً.";return;}
 if(!data.session){
  statusEl.textContent="لم يتم تسجيل الدخول. سجّل الدخول أولاً.";
  loginLink.hidden=false;
  logoutButton.hidden=true;
  return;
 }
 statusEl.textContent="تم التحقق من تسجيل الدخول للحساب: "+data.session.user.email+"\nلكن لم يتم بعد تفعيل أو التحقق من دور الإدارة في قاعدة البيانات؛ لذلك تبقى لوحة الإدارة مغلقة لحماية بيانات المشروع.";
 loginLink.hidden=true;
 logoutButton.hidden=false;
}
logoutButton.addEventListener("click",async()=>{
 const {error}=await client.auth.signOut();
 statusEl.textContent=error?"تعذر تسجيل الخروج.":"تم تسجيل الخروج بنجاح.";
 await checkSession();
});
client.auth.onAuthStateChange(()=>checkSession());
checkSession();
</script>
</body>
</html>
