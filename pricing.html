<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خطط الاشتراك | GLOBAL ENERGY</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font-family:Tahoma,Arial;line-height:1.8}header{background:#17243a;border-bottom:2px solid #35c9a0;padding:20px 6%}main{max-width:1050px;margin:auto;padding:30px 18px}h1,h2{color:#35c9a0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}.card{background:#1c2b40;border:1px solid #30445c;border-radius:12px;padding:22px}.price{font-size:30px;font-weight:bold;color:#35c9a0}.muted{color:#c5cfdd}.notice{background:#17243a;padding:16px;border:1px solid #52647a;border-radius:10px;margin:20px 0}a{color:#35c9a0}</style></head><body><header>GLOBAL ENERGY & TECHNOLOGY</header><main><a href="index.html">العودة للرئيسية</a><h1>خطط الاشتراك المقترحة</h1><div class="notice"><strong>الأسعار مسودة قابلة للتغيير وليست عرض بيع فعّالاً.</strong> لا يمكن الدفع أو تفعيل الاشتراكات من هذه الصفحة.</div><div id="plans" class="grid"><p>جارٍ تحميل الخطط...</p></div><p class="muted">عمليات شراء المنتجات تتم مباشرة بين المشتري والتاجر؛ المنصة لا تحصّل ثمن المنتجات.</p></main><script>fetch('pricing.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const root=document.getElementById('plans');root.replaceChildren();data.plans.forEach(p=>{const card=document.createElement('section');card.className='card';const title=document.createElement('h2');title.textContent=p.name;const price=document.createElement('div');price.className='price';price.textContent=p.amount+' '+data.currency;const interval=document.createElement('p');interval.className='muted';interval.textContent=p.interval==='month'?'شهرياً':'مرة واحدة';card.append(title,price,interval);root.append(card)})}).catch(()=>{document.getElementById('plans').textContent='تعذّر تحميل الأسعار حالياً.'});</script></body></html>
