<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المهندسين | GLOBAL ENERGY</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font:15px Tahoma,Arial;line-height:1.8}main,header{max-width:960px;margin:auto;padding:18px}a,h1,h2,h3{color:#35c9a0}.panel{background:#1c2b40;border:1px solid #344960;border-radius:12px;padding:18px;margin:16px 0}input,textarea,select{width:100%;padding:10px;border:1px solid #60748a;border-radius:7px;background:#101827;color:white;font:inherit}textarea{min-height:110px}label{display:block;margin:10px 0}button{background:#35c9a0;border:0;border-radius:7px;padding:11px 18px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.muted{color:#bfcddb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}article{border-top:1px solid #455c72;padding:12px 0}#status{color:#ffe2a4}</style></head><body><header><a href="index.html">الرئيسية</a> · <a href="solar-request.html">طلبات العملاء</a> · <a href="login.html">الحساب</a></header><main><h1>لوحة المهندسين والفنيين</h1><p class="muted">تظهر هنا المهام المسندة لحسابك فقط. لا يمكن تعديل أجهزة العملاء دون موافقة صريحة، ولا تُعتمد عروض الأسعار تلقائياً.</p><p id="status" role="status">جار التحقق من الحساب...</p><div id="tasks"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const $=id=>document.getElementById(id);if(!window.supabase){$('status').textContent='تعذر تحميل المكتبة';return}const db=window.supabase.createClient('https://dagjfsqnfrzcmtjqmypy.supabase.co','sb_publishable_Ca6rTp5OS9IxNJ0jnnaYvQ_lNRanlDK');let user=null;const e=(tag,txt)=>{const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;return n};async function init(){const {data,error}=await db.auth.getUser();user=error?null:data.user;if(!user){$('status').replaceChildren(e('span','يلزم تسجيل الدخول: '));const a=e('a','الدخول');a.href='login.html';$('status').append(a);return}$('status').textContent='الحساب: '+user.email;await load()}async function load(){const {data:assignments,error}=await db.from('solar_project_assignments').select('project_id,role,status').eq('worker_id',user.id).neq('status','revoked').order('created_at',{ascending:false});$('tasks').replaceChildren();if(error){$('tasks').textContent='تعذر تحميل المهام';return}if(!assignments.length){$('tasks').textContent='لا توجد مشاريع مسندة لحسابك حالياً';return}for(const a of assignments){const card=e('section');card.className='panel';card.append(e('h2','مهمة '+a.role+' · '+a.status));const {data:p}=await db.from('solar_project_requests').select('service_kind,city,country,details,monthly_kwh,roof_area_m2,battery_needed,status').eq('id',a.project_id).maybeSingle();if(p){card.append(e('p',p.service_kind+' · '+p.city+'، '+p.country+' · '+p.status));card.append(e('p',p.details));card.append(e('p','الاستهلاك الشهري: '+(p.monthly_kwh??'غير معروف')+' kWh · المساحة: '+(p.roof_area_m2??'غير معروفة')+' م²'))}else{card.append(e('p','تعذر عرض تفاصيل المشروع أو انتهت صلاحية الوصول'))}$('tasks').append(card);if(!p)continue;const notes=e('div');card.append(e('h3','سجل المتابعة'),notes);const {data:updates}=await db.from('solar_project_updates').select('note,created_at').eq('project_id',a.project_id).order('created_at',{ascending:true}).limit(50);for(const n of updates||[])notes.append(e('p',new Date(n.created_at).toLocaleString('ar')+' — '+n.note));const form=e('form');const label=e('label','إضافة تقرير أو استفسار للعميل');const ta=e('textarea');ta.required=true;ta.minLength=5;ta.maxLength=3000;label.append(ta);const btn=e('button','حفظ التقرير');btn.type='submit';form.append(label,btn);if(!['assigned','working'].includes(a.status))form.hidden=true;card.append(form);form.onsubmit=async ev=>{ev.preventDefault();btn.disabled=true;const {error:err}=await db.from('solar_project_updates').insert({project_id:a.project_id,author_id:user.id,note:ta.value.trim()});alert(err?'تعذر حفظ التقرير':'تم حفظ التقرير');btn.disabled=false;if(!err)load()};if(['reviewer','supervisor','engineer'].includes(a.role)){const qa=e('section');qa.append(e('h3','تقرير فحص الجودة والسلامة'));const {data:checks}=await db.from('solar_project_quality_checks').select('check_type,outcome,evidence_note,created_at').eq('project_id',a.project_id).order('created_at',{ascending:false}).limit(30);for(const x of checks||[])qa.append(e('p',x.check_type+' · '+x.outcome+' — '+x.evidence_note));if(['assigned','working'].includes(a.status)){const qform=e('form');const type=e('select');for(const v of ['electrical_safety','structural_safety','equipment_match','installation_quality','commissioning','fraud_signal','financial_reconciliation']){const o=e('option',v);o.value=v;type.append(o)}const outcome=e('select');for(const v of [['passed','اجتاز'],['needs_action','يحتاج إجراء'],['blocked','إيقاف حتى التصحيح']]){const o=e('option',v[1]);o.value=v[0];outcome.append(o)}const evidence=e('textarea');evidence.placeholder='الأدلة والملاحظات الفنية (10 أحرف على الأقل)';evidence.required=true;evidence.minLength=10;evidence.maxLength=4000;const submit=e('button','حفظ تقرير الفحص');submit.type='submit';qform.append(type,outcome,evidence,submit);qform.onsubmit=async ev=>{ev.preventDefault();submit.disabled=true;const {error:err}=await db.from('solar_project_quality_checks').insert({project_id:a.project_id,reviewer_id:user.id,check_type:type.value,outcome:outcome.value,evidence_note:evidence.value.trim()});alert(err?'تعذر حفظ الفحص':'تم حفظ الفحص');submit.disabled=false;if(!err)load()};qa.append(qform)}card.append(qa)}}const {data:remediations}=await db.from('solar_project_remediations').select('id,description,status,assigned_worker_id').eq('project_id',a.project_id).order('created_at',{ascending:false});if(remediations?.length){card.append(e('h3','إجراءات الإصلاح والتدقيق'));for(const item of remediations){const line=e('article',item.status+' — '+item.description);if(item.assigned_worker_id===user.id&&item.status==='open'){const b=e('button','بدء معالجة المخالفة');b.onclick=async()=>{b.disabled=true;const {error:err}=await db.rpc('advance_solar_remediation',{p_id:item.id,p_action:'start',p_note:null});alert(err?'تعذر بدء المعالجة':'تم تسجيل بدء المعالجة');if(!err)load();else b.disabled=false};line.append(b)}if(item.assigned_worker_id===user.id&&item.status==='in_progress'){const b=e('button','تقديم تقرير إتمام المعالجة');b.onclick=async()=>{const note=prompt('اكتب تفاصيل الإصلاح والأدلة (10 أحرف على الأقل)');if(!note||note.trim().length<10)return;b.disabled=true;const {error:err}=await db.rpc('advance_solar_remediation',{p_id:item.id,p_action:'submit',p_note:note.trim()});alert(err?'تعذر تقديم التقرير':'تم إرسال المعالجة للمراجعة المستقلة');if(!err)load();else b.disabled=false};line.append(b)}if(['reviewer','supervisor'].includes(a.role)&&item.status==='submitted'&&item.assigned_worker_id!==user.id){for(const [action,title] of [['verify','اعتماد الإصلاح'],['reject','رفض الإصلاح']]){const b=e('button',title);b.onclick=async()=>{const note=prompt('سجل سبب القرار والأدلة (10 أحرف على الأقل)');if(!note||note.trim().length<10)return;b.disabled=true;const {error:err}=await db.rpc('advance_solar_remediation',{p_id:item.id,p_action:action,p_note:note.trim()});alert(err?'تعذر تسجيل القرار':'تم تسجيل قرار المراجع');if(!err)load();else b.disabled=false};line.append(b)}}card.append(line)}}const rewardSection=e('section');rewardSection.append(e('h3','طلب مستحقات عمل منجز'));const {data:claims}=await db.from('solar_worker_reward_claims').select('work_category,requested_amount,currency,status,review_note').eq('project_id',a.project_id).eq('worker_id',user.id).order('created_at',{ascending:false});for(const claim of claims||[])rewardSection.append(e('p',claim.work_category+' · '+claim.requested_amount+' '+claim.currency+' · '+claim.status+(claim.review_note?' — '+claim.review_note:'')));if(['assigned','working','submitted','completed'].includes(a.status)){const form=e('form');const category=e('select');for(const [v,t] of [['engineering','هندسة'],['installation','تركيب'],['supervision','إشراف'],['quality_review','مراجعة جودة'],['remote_support','دعم عن بعد'],['customer_support','خدمة عملاء']]){const o=e('option',t);o.value=v;category.append(o)}const description=e('textarea');description.required=true;description.minLength=20;description.placeholder='وصف العمل الذي تم إنجازه بالتفصيل (20 حرفاً على الأقل)';const evidence=e('input');evidence.required=true;evidence.minLength=8;evidence.placeholder='مرجع دليل الإنجاز أو رقم التقرير';const amount=e('input');amount.type='number';amount.min='0';amount.step='0.01';amount.required=true;amount.placeholder='المبلغ المطلوب';const currency=e('input');currency.required=true;currency.maxLength=8;currency.placeholder='العملة ILS';const button=e('button','تقديم طلب مستحقات للمراجعة');button.type='submit';form.append(category,description,evidence,amount,currency,button);form.onsubmit=async ev=>{ev.preventDefault();button.disabled=true;const {error:err}=await db.from('solar_worker_reward_claims').insert({project_id:a.project_id,worker_id:user.id,submitted_by:user.id,work_category:category.value,description:description.value.trim(),evidence_reference:evidence.value.trim(),requested_amount:Number(amount.value),currency:currency.value.trim().toUpperCase()});alert(err?'تعذر تقديم المطالبة':'تم تسجيل المطالبة للمراجعة، دون اعتماد أو صرف');button.disabled=false;if(!err)load()};rewardSection.append(form)}card.append(rewardSection);if(!['engineer','supervisor'].includes(a.role))continue;card.append(e('h3','عروض الأسعار'));const {data:quotes}=await db.from('solar_project_quotes').select('id,company_name,currency,total_price,description,status').eq('project_id',a.project_id).eq('author_id',user.id).order('created_at',{ascending:false});for(const q of quotes||[]){const line=e('article',q.company_name+' · '+q.total_price+' '+q.currency+' · '+q.status);if(q.status==='draft'&&['assigned','working'].includes(a.status)){const publish=e('button','تقديم العرض للعميل');publish.onclick=async()=>{if(!confirm('تقديم العرض كما هو للعميل؟'))return;publish.disabled=true;const {error:err}=await db.from('solar_project_quotes').update({status:'submitted'}).eq('id',q.id).eq('status','draft');alert(err?'تعذر تقديم العرض':'تم تقديم العرض');await load()};line.append(publish)}card.append(line)}if(!['assigned','working'].includes(a.status))continue;const quote=e('form');quote.className='grid';const fields=[['company_name','اسم الشركة','text'],['currency','العملة (ILS, USD...)','text'],['total_price','المبلغ الإجمالي','number'],['description','تفاصيل المعدات والضمان والاستثناءات','textarea']];for(const [key,title,type] of fields){const lab=e('label',title);const input=e(type==='textarea'?'textarea':'input');input.name=key;if(type!=='textarea')input.type=type;input.required=true;if(key==='total_price'){input.min='0';input.step='0.01'}if(key==='currency')input.maxLength=8;if(key==='description')input.minLength=10;lab.append(input);quote.append(lab)}const save=e('button','حفظ مسودة عرض');save.type='submit';quote.append(save);card.append(quote);quote.onsubmit=async ev=>{ev.preventDefault();save.disabled=true;const f=new FormData(quote);const {error:err}=await db.from('solar_project_quotes').insert({project_id:a.project_id,author_id:user.id,company_name:String(f.get('company_name')).trim(),currency:String(f.get('currency')).trim().toUpperCase(),total_price:Number(f.get('total_price')),description:String(f.get('description')).trim()});alert(err?'تعذر حفظ المسودة':'تم حفظ مسودة العرض');save.disabled=false;if(!err)load()}}}init()})();</script></body></html>
