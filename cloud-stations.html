<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محطاتي السحابية | GLOBAL ENERGY</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:Tahoma,Arial;line-height:1.8}header,main{max-width:950px;margin:auto;padding:22px}h1,h2{color:#35c9a0}.panel{background:#1c2b40;border:1px solid #30445c;border-radius:12px;padding:18px;margin:15px 0}input,select,button{font:inherit;padding:10px;border-radius:8px;margin:5px 0}input,select{background:#101827;color:#fff;border:1px solid #52647a;width:100%}button{background:#35c9a0;color:#10202a;border:0;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}a{color:#35c9a0}.muted{color:#bdc9d5}.status{color:#f4c66b}</style></head><body><header><a href="dashboard.html">لوحة المستخدم</a> · <a href="monitoring.html">المحطات التجريبية</a><h1>محطاتي المرتبطة بالحساب</h1><p class="muted">إدارة بيانات المحطات على Supabase. لا توجد مراقبة مباشرة أو تحكم بالأجهزة في هذه المرحلة.</p></header><main><p id="status" class="status" role="status">جارٍ التحقق من الجلسة...</p><section class="panel" id="createPanel" hidden><h2>إضافة محطة</h2><form id="stationForm"><label>اسم المحطة<input id="name" maxlength="120" required placeholder="محطة المنزل"></label><label>الموقع التقريبي (اختياري)<input id="location" maxlength="160" placeholder="البلدة أو المنطقة"></label><label>القدرة بالكيلوواط<input id="capacity" type="number" min="0.1" max="100000" step="0.1" required></label><label>نوع النظام<select id="type"><option value="on_grid">متصل بالشبكة</option><option value="off_grid">منفصل عن الشبكة</option><option value="hybrid">هجين</option></select></label><label>ماركة الانفرتر<select id="brand"><option>DYA</option><option>GoodWe</option><option>SMA</option><option>Voltronic / Axpert</option><option>Solis</option><option>Huawei</option><option>Growatt</option><option>Deye</option><option>Other</option></select></label><label>موديل الانفرتر (اختياري)<input id="model" maxlength="120"></label><button id="submit" type="submit">حفظ المحطة</button></form></section><section class="panel"><h2>قائمة محطاتي</h2><div id="stations" class="grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>const db=supabase.createClient('https://dagjfsqnfrzcmtjqmypy.supabase.co','sb_publishable_Ca6rTp5OS9IxNJ0jnnaYvQ_lNRanlDK');const $=id=>document.getElementById(id);let currentUser=null;function item(tag,value){const e=document.createElement(tag);e.textContent=value;return e}async function load(){const box=$('stations');box.replaceChildren(item('p','جارٍ التحميل...'));const {data,error}=await db.from('stations').select('id,name,location,capacity_kw,system_type,station_inverters(brand,model,monitoring_status)').order('created_at',{ascending:false});box.replaceChildren();if(error){box.append(item('p','تعذر جلب المحطات. راجع الصلاحيات.'));return}if(!data.length){box.append(item('p','لا توجد محطات مرتبطة بهذا الحساب بعد.'));return}for(const s of data){const card=item('article','');card.className='panel';card.append(item('h2',s.name),item('p',(s.location||'بدون موقع')+' · '+s.capacity_kw+' kW'),item('p','نوع النظام: '+s.system_type));for(const inv of s.station_inverters||[])card.append(item('p','الانفرتر: '+inv.brand+' '+(inv.model||'')+' · '+(inv.monitoring_status==='connected'?'مرتبط':'غير مربوط فعلياً')));const telemetryButton=item('button','عرض القراءات');telemetryButton.type='button';telemetryButton.onclick=()=>showTelemetry(s.id,card);card.append(telemetryButton);box.append(card)}}async function showTelemetry(stationId,card){const existing=card.querySelector('.telemetry');if(existing){existing.remove();return}const area=item('section','');area.className='telemetry';area.append(item('h3','قراءات المحطة — الاختبار اليدوي منفصل عن الربط الحقيقي'));const {data,error}=await db.from('station_telemetry_samples').select('sampled_at,source,solar_power_kw,load_power_kw,battery_soc,device_status,note').eq('station_id',stationId).order('sampled_at',{ascending:false}).limit(15);if(error)area.append(item('p','تعذر جلب القراءات'));else if(!data.length)area.append(item('p','لا توجد قراءات بعد — لم يتم ربط الجهاز فعلياً'));else for(const x of data){const line=item('p',new Date(x.sampled_at).toLocaleString('ar')+' · '+(x.source==='manual_test'?'اختبار يدوي':'موصل موثّق')+' · إنتاج '+(x.solar_power_kw??'—')+' kW · استهلاك '+(x.load_power_kw??'—')+' kW · بطارية '+(x.battery_soc??'—')+'% · '+x.device_status);if(x.device_status==='fault'||x.device_status==='warning')line.className='status';area.append(line)}const form=document.createElement('form');form.append(item('h3','إدخال قراءة اختبارية يدوياً'));const inputs={};for(const [key,label,max] of [['solar_power_kw','الإنتاج kW',100000],['load_power_kw','الاستهلاك kW',100000],['battery_soc','البطارية %',100]]){const wrap=document.createElement('label');wrap.append(item('span',label));const inp=document.createElement('input');inp.type='number';inp.step='0.01';inp.min='0';inp.max=String(max);inp.placeholder='اختياري';wrap.append(inp);form.append(wrap);inputs[key]=inp}const status=document.createElement('select');for(const [value,label] of [['normal','طبيعي'],['warning','تحذير'],['fault','عطل'],['offline','غير متصل'],['unknown','غير معروف']]){const o=document.createElement('option');o.value=value;o.textContent=label;status.append(o)}form.append(status);const submit=item('button','حفظ قراءة اختبارية');submit.type='submit';form.append(submit);form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;const payload={station_id:stationId,source:'manual_test',submitted_by:currentUser.id,device_status:status.value};for(const [key,inp] of Object.entries(inputs))payload[key]=inp.value===''?null:Number(inp.value);const {error}=await db.from('station_telemetry_samples').insert(payload);alert(error?'تعذر الحفظ: '+error.message:'حُفظت قراءة اختبارية وليست بيانات حية');submit.disabled=false;if(!error){area.remove();showTelemetry(stationId,card)}});area.append(form);card.append(area)}async function init(){const {data:{user},error}=await db.auth.getUser();if(error||!user){$('status').textContent='هذه الصفحة تتطلب تسجيل الدخول. يمكنك استخدام صفحة المحطات التجريبية دون حساب.';const a=document.createElement('a');a.href='login.html';a.textContent='صفحة الحساب';$('status').append(' ',a);$('stations').replaceChildren();return}currentUser=user;$('status').textContent='تم التحقق من الحساب. بيانات المحطات خاصة بصاحبها.';$('createPanel').hidden=false;await load()}$('stationForm').addEventListener('submit',async ev=>{ev.preventDefault();if(!currentUser)return;const btn=$('submit');btn.disabled=true;const payload={owner_id:currentUser.id,name:$('name').value.trim(),location:$('location').value.trim()||null,capacity_kw:Number($('capacity').value),system_type:$('type').value};const {data,error}=await db.from('stations').insert(payload).select('id').single();if(error){$('status').textContent='تعذر حفظ المحطة: '+error.message;btn.disabled=false;return}const {error:invError}=await db.from('station_inverters').insert({station_id:data.id,brand:$('brand').value,model:$('model').value.trim()||null});$('status').textContent=invError?'حُفظت المحطة لكن تعذرت إضافة الانفرتر.':'حُفظت المحطة والانفرتر. المراقبة الحقيقية غير متصلة بعد.';$('stationForm').reset();btn.disabled=false;await load()});init();</script></body></html>
