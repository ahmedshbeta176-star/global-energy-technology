<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اعتماد مقدمي الخدمات | GLOBAL ENERGY</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font:15px Tahoma,Arial;line-height:1.8}header{background:#17243a;border-bottom:2px solid #35c9a0;padding:20px}main{max-width:1000px;margin:auto;padding:20px}h1,h2,a{color:#35c9a0}.panel{background:#1c2b40;border:1px solid #30445c;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}button{padding:10px 15px;border:0;border-radius:8px;background:#35c9a0;color:#101827;font-weight:bold;cursor:pointer;margin:5px}button.reject{background:#f0a3a3}button:disabled{opacity:.5}.muted{color:#c5cfdd}select{padding:12px;background:#17243a;color:white;border:1px solid #52647a;border-radius:8px}p{overflow-wrap:anywhere}</style></head><body><header><strong>GLOBAL ENERGY & TECHNOLOGY</strong> · <a href="index.html">الرئيسية</a> · <a href="admin.html">لوحة الإدارة</a></header><main><h1>اعتماد مقدّمي الخدمات</h1><p class="muted">لوحة محمية لمراجعة طلبات المهندسين والفنيين والشركات. لا يمكن تنفيذ القرارات إلا من حساب إداري مخوّل في قاعدة البيانات.</p><div class="panel"><label for="filter">عرض الطلبات: </label><select id="filter"><option value="pending">بانتظار المراجعة</option><option value="approved">المعتمدة</option><option value="rejected">المرفوضة</option><option value="all">جميع الطلبات</option></select><button id="refresh">تحديث القائمة</button><p id="status" role="status">جار التحقق من الصلاحيات...</p></div><div id="cards" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const $=id=>document.getElementById(id);let db,items=[];function node(t,s){const e=document.createElement(t);e.textContent=s||'';return e}function render(){const f=$('filter').value;const rows=items.filter(p=>f==='all'||p.status===f);$('cards').replaceChildren();$('status').textContent='عدد الطلبات المعروضة: '+rows.length;rows.forEach(p=>{const c=node('article');c.className='panel';c.append(node('h2',p.display_name),node('p',p.kind+' · '+p.specialty),node('p',p.city+'، '+p.country),node('p',p.description||'لا يوجد وصف'),node('p','الحالة: '+p.status),node('p','الهاتف: '+(p.phone||'غير مضاف')));for(const [value,label,cls] of [['approved','موافقة',''],['rejected','رفض','reject'],['pending','إعادة للمراجعة','']]){if(value===p.status)continue;const b=node('button',label);b.className=cls;b.onclick=async()=>{if(!confirm('تأكيد قرار: '+label+'؟'))return;b.disabled=true;const {error}=await db.rpc('review_service_profile',{p_id:p.id,p_status:value});if(error){$('status').textContent='تعذر تنفيذ القرار: '+error.message;b.disabled=false;return}await load()};c.append(b)}$('cards').append(c)})}async function load(){const {data,error}=await db.rpc('list_service_profile_reviews');if(error){$('cards').replaceChildren();$('status').textContent=error.message.includes('Not authorized')?'هذا الحساب غير مخوّل لإدارة طلبات الخدمات.':'تعذر جلب الطلبات: '+error.message;return}items=data||[];render()}$('filter').onchange=render;$('refresh').onclick=load;async function init(){if(!window.supabase){$('status').textContent='تعذر تحميل خدمة الاتصال.';return}db=window.supabase.createClient('https://dagjfsqnfrzcmtjqmypy.supabase.co','sb_publishable_Ca6rTp5OS9IxNJ0jnnaYvQ_lNRanlDK');const {data}=await db.auth.getUser();if(!data.user){$('status').replaceChildren(node('span','سجّل دخولك أولاً. '));const a=node('a','صفحة تسجيل الدخول');a.href='login.html';$('status').append(a);return}await load()}init();</script></body></html>
