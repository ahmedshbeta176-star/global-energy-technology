<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المشاريع | GLOBAL ENERGY</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font:15px Tahoma,Arial;line-height:1.8}main,header{max-width:1000px;margin:auto;padding:18px}h1,h2,h3,a{color:#35c9a0}.panel{background:#1c2b40;border:1px solid #344960;border-radius:12px;padding:18px;margin:16px 0}.muted{color:#bfcddb}input,select,textarea{width:100%;padding:10px;border:1px solid #60748a;border-radius:7px;background:#101827;color:white;font:inherit}label{display:block;margin:10px 0}button{background:#35c9a0;border:0;border-radius:7px;padding:10px 16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}article{border-top:1px solid #506078;padding:10px 0}#notice{color:#ffe0a0}</style></head><body><header><a href="index.html">الرئيسية</a> · <a href="operations.html">مركز التشغيل</a> · <a href="solar-worker.html">لوحة المهندسين</a></header><main><h1>إدارة طلبات مشاريع الطاقة</h1><p class="muted">هذه اللوحة مخصصة فقط لحسابات مسؤولي التوزيع المعتمدين في قاعدة البيانات. لا تمنح صلاحيات الإدارة تلقائياً لأي حساب.</p><p id="notice" role="status">جار التحقق من الصلاحيات...</p><div id="projects"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const $=id=>document.getElementById(id);if(!window.supabase){$('notice').textContent='تعذر الاتصال';return}const db=window.supabase.createClient('https://dagjfsqnfrzcmtjqmypy.supabase.co','sb_publishable_Ca6rTp5OS9IxNJ0jnnaYvQ_lNRanlDK');const el=(tag,t)=>{const n=document.createElement(tag);if(t!==undefined)n.textContent=t;return n};let user;async function init(){const {data,error}=await db.auth.getUser();user=error?null:data.user;if(!user){$('notice').textContent='يرجى تسجيل الدخول من صفحة الحساب';return}await load()}async function load(){const {data,error}=await db.from('solar_project_requests').select('id,service_kind,city,country,details,status,created_at').order('created_at',{ascending:false}).limit(100);$('projects').replaceChildren();if(error){$('notice').textContent='تعذر قراءة الطلبات أو لا تملك صلاحية الوصول';return}if(!data.length){$('notice').textContent='لا توجد طلبات ظاهرة لحسابك. يلزم تعيين مسؤول توزيع معتمد لعرض جميع الطلبات.';return}$('notice').textContent='المشاريع الظاهرة: '+data.length+' — صلاحيات التعيين والتحرير محمية على الخادم';for(const p of data){const card=el('section');card.className='panel';card.append(el('h2',p.service_kind+' · '+p.city+'، '+p.country),el('p',p.details),el('p','الحالة: '+p.status+' · '+new Date(p.created_at).toLocaleDateString('ar')));$('projects').append(card);const assignments=el('div');card.append(el('h3','الفريق المكلف'),assignments);const {data:team}=await db.from('solar_project_assignments').select('worker_id,role,status').eq('project_id',p.id);for(const a of team||[])assignments.append(el('p',a.role+' · '+a.worker_id+' · '+a.status));if(!team?.length)assignments.textContent='لا يوجد تكليف ظاهر';const assign=el('form');assign.className='grid';const uid=el('input');uid.required=true;uid.placeholder='معرّف حساب الفني أو المهندس UUID';uid.pattern='[0-9a-fA-F-]{36}';const role=el('select');for(const x of [['engineer','مهندس'],['technician','فني'],['reviewer','مراجع مستقل'],['supervisor','مشرف']]){const o=el('option',x[1]);o.value=x[0];role.append(o)}const submit=el('button','تعيين العامل');submit.type='submit';assign.append(uid,role,submit);card.append(assign);assign.onsubmit=async ev=>{ev.preventDefault();if(!confirm('تعيين الحساب المحدد على هذا المشروع؟'))return;submit.disabled=true;const {error:err}=await db.from('solar_project_assignments').insert({project_id:p.id,worker_id:uid.value.trim(),assigned_by:user.id,role:role.value});alert(err?'تعذر التعيين. تحقق من الصلاحيات ومعرف العامل وعدم تكرار التكليف.':'تم التعيين');submit.disabled=false;if(!err)load()};const statusForm=el('form');const status=el('select');for(const s of ['pending','reviewing','needs_info','quoted','closed','cancelled']){const o=el('option',s);o.value=s;if(s===p.status)o.selected=true;status.append(o)}const update=el('button','حفظ حالة المشروع');update.type='submit';statusForm.append(status,update);card.append(statusForm);statusForm.onsubmit=async ev=>{ev.preventDefault();if(!confirm('تغيير حالة المشروع؟'))return;update.disabled=true;const {error:err}=await db.from('solar_project_requests').update({status:status.value}).eq('id',p.id);alert(err?'تعذر تغيير الحالة':'تم تحديث الحالة');update.disabled=false;if(!err)load()}}}init()})();</script></body></html>
