<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المشاريع | GLOBAL ENERGY</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font:15px Tahoma,Arial;line-height:1.8}main,header{max-width:1000px;margin:auto;padding:18px}h1,h2,h3,a{color:#35c9a0}.panel{background:#1c2b40;border:1px solid #344960;border-radius:12px;padding:18px;margin:16px 0}.muted{color:#bfcddb}input,select,textarea{width:100%;padding:10px;border:1px solid #60748a;border-radius:7px;background:#101827;color:white;font:inherit}label{display:block;margin:10px 0}button{background:#35c9a0;border:0;border-radius:7px;padding:10px 16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}article{border-top:1px solid #506078;padding:10px 0}#notice{color:#ffe0a0}</style></head><body><header><a href="index.html">الرئيسية</a> · <a href="operations.html">مركز التشغيل</a> · <a href="solar-worker.html">لوحة المهندسين</a></header><main><h1>إدارة طلبات مشاريع الطاقة</h1><p class="muted">هذه اللوحة مخصصة فقط لحسابات مسؤولي التوزيع المعتمدين في قاعدة البيانات. لا تمنح صلاحيات الإدارة تلقائياً لأي حساب.</p><p id="notice" role="status">جار التحقق من الصلاحيات...</p><div id="projects"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const $=id=>document.getElementById(id);if(!window.supabase){$('notice').textContent='تعذر الاتصال';return}const db=window.supabase.createClient('https://dagjfsqnfrzcmtjqmypy.supabase.co','sb_publishable_Ca6rTp5OS9IxNJ0jnnaYvQ_lNRanlDK');const el=(tag,t)=>{const n=document.createElement(tag);if(t!==undefined)n.textContent=t;return n};let user;async function init(){const {data,error}=await db.auth.getUser();user=error?null:data.user;if(!user){$('notice').textContent='يرجى تسجيل الدخول من صفحة الحساب';return}await load()}async function load(){const {data,error}=await db.from('solar_project_requests').select('id,service_kind,city,country,details,status,created_at').order('created_at',{ascending:false}).limit(100);$('projects').replaceChildren();if(error){$('notice').textContent='تعذر قراءة الطلبات أو لا تملك صلاحية الوصول';return}if(!data.length){$('notice').textContent='لا توجد طلبات ظاهرة لحسابك. يلزم تعيين مسؤول توزيع معتمد لعرض جميع الطلبات.';return}$('notice').textContent='المشاريع الظاهرة: '+data.length+' — صلاحيات التعيين والتحرير محمية على الخادم';for(const p of data){const card=el('section');card.className='panel';card.append(el('h2',p.service_kind+' · '+p.city+'، '+p.country),el('p',p.details),el('p','الحالة: '+p.status+' · '+new Date(p.created_at).toLocaleDateString('ar')));$('projects').append(card);const assignments=el('div');card.append(el('h3','الفريق المكلف'),assignments);const {data:team}=await db.from('solar_project_assignments').select('worker_id,role,status').eq('project_id',p.id);for(const a of team||[])assignments.append(el('p',a.role+' · '+a.worker_id+' · '+a.status));if(!team?.length)assignments.textContent='لا يوجد تكليف ظاهر';const {data:quality}=await db.from('solar_project_quality_checks').select('id,check_type,outcome,evidence_note').eq('project_id',p.id).order('created_at',{ascending:false});if(quality?.length){card.append(el('h3','فحوص الجودة'));for(const q of quality){const line=el('article',q.check_type+' · '+q.outcome+' — '+q.evidence_note);if(q.outcome!=='passed'){const btn=el('button','فتح إجراء تصحيحي');btn.onclick=async()=>{const description=prompt('وصف الإجراء التصحيحي المطلوب (10 أحرف على الأقل)');if(!description||description.trim().length<10)return;btn.disabled=true;const {error:err}=await db.from('solar_project_remediations').insert({project_id:p.id,quality_check_id:q.id,opened_by:user.id,description:description.trim()});alert(err?'تعذر فتح الإجراء؛ ربما تم فتح إجراء سابق أو لا تملك صلاحية':'تم فتح الإجراء التصحيحي');btn.disabled=false;if(!err)load()};line.append(btn)}card.append(line)}}const {data:remedies}=await db.from('solar_project_remediations').select('id,description,status,created_at').eq('project_id',p.id);if(remedies?.length){card.append(el('h3','الإجراءات التصحيحية'));for(const x of remedies){const line=el('article',x.status+' — '+x.description);if(x.status==='submitted'){for(const [action,title] of [['verify','اعتماد المعالجة'],['reject','رفض المعالجة']]){const b=el('button',title);b.type='button';b.onclick=async()=>{const note=prompt('اكتب سبب القرار وأدلة التحقق (10 أحرف على الأقل)');if(!note||note.trim().length<10)return;b.disabled=true;const {error:err}=await db.rpc('advance_solar_remediation',{p_id:x.id,p_action:action,p_note:note.trim()});alert(err?'تعذر تحديث الإجراء أو لا تملك الصلاحية':'تم تسجيل القرار في سجل التدقيق');b.disabled=false;if(!err)load()};line.append(b)}}card.append(line)}}const {data:commissions}=await db.from('solar_project_commission_records').select('id,company_name,currency,agreed_platform_commission,supervision_cost,payment_status').eq('project_id',p.id);card.append(el('h3','العمولات المسجلة'));for(const x of commissions||[]){const line=el('article',x.company_name+' · عمولة '+x.agreed_platform_commission+' '+x.currency+' · إشراف '+x.supervision_cost+' · '+x.payment_status);const options={unverified:[['invoice','تسجيل إصدار مطالبة']],invoiced:[['record_receipt','تسجيل استلام مبلغ'],['cancel','إلغاء الاتفاق']],received:[['reconcile','تأكيد المطابقة المالية']]};for(const [action,title] of options[x.payment_status]||[]){const b=el('button',title);b.type='button';b.onclick=async()=>{const evidence=prompt('مرجع المستند أو الإيصال (8 أحرف على الأقل). لا تسجل التحصيل دون إثبات حقيقي');if(!evidence||evidence.trim().length<8)return;b.disabled=true;const {error:err}=await db.rpc('advance_solar_commission',{p_id:x.id,p_action:action,p_evidence:evidence.trim()});alert(err?'تعذر تحديث الحالة؛ تحقق من الصلاحيات والمستند':'تم تسجيل التغيير في سجل التدقيق');b.disabled=false;if(!err)load()};line.append(b)}card.append(line)};if(commissions?.length){const reconciled=commissions.filter(x=>x.payment_status==='reconciled');const byCurrency={};for(const x of reconciled){const currency=x.currency;const row=byCurrency[currency]||(byCurrency[currency]={gross:0,supervision:0,remaining:0});row.gross+=Number(x.agreed_platform_commission);row.supervision+=Number(x.supervision_cost);row.remaining+=Number(x.agreed_platform_commission)-Number(x.supervision_cost)}card.append(el('h3','ملخص العمولات المطابقة فقط'));if(!reconciled.length)card.append(el('p','لا توجد عمولات مثبتة ومطابقة بعد. لا تُحسب الاتفاقات غير المحصلة إيراداً.'));for(const [currency,row] of Object.entries(byCurrency))card.append(el('p',currency+' — إجمالي عمولة: '+row.gross.toFixed(2)+' · إشراف: '+row.supervision.toFixed(2)+' · متبقٍ قبل بقية التكاليف والضرائب: '+row.remaining.toFixed(2)));card.append(el('p','هذا المتبقي ليس ربحاً صافياً ولا رصيداً قابلاً للتوزيع على العاملين.'))}const {data:claims}=await db.from('solar_worker_reward_claims').select('id,worker_id,work_category,description,evidence_reference,requested_amount,currency,status,review_note').eq('project_id',p.id).order('created_at',{ascending:false});card.append(el('h3','مطالبات العاملين'));if(!claims?.length)card.append(el('p','لا توجد مطالبات مسجلة'));for(const claim of claims||[]){const line=el('article',claim.work_category+' · '+claim.requested_amount+' '+claim.currency+' · '+claim.status);line.append(el('p',claim.description+' — الدليل: '+claim.evidence_reference));if(claim.review_note)line.append(el('p','قرار المراجعة: '+claim.review_note));if(claim.status==='submitted'){for(const [action,title] of [['approved','اعتماد المطالبة'],['rejected','رفض المطالبة']]){const b=el('button',title);b.type='button';b.onclick=async()=>{const note=prompt('سبب القرار وأدلة التحقق (10 أحرف على الأقل)');if(!note||note.trim().length<10)return;if(!confirm('هذا القرار يسجل اعتماداً إدارياً فقط ولا يصرف أموالاً. هل تتابع؟'))return;b.disabled=true;const {error:err}=await db.rpc('review_solar_worker_reward',{p_claim:claim.id,p_decision:action,p_note:note.trim()});alert(err?'تعذر اعتماد المطالبة؛ تحقق من الصلاحيات والمطابقة المالية وعدم المراجعة الذاتية':'تم حفظ القرار في سجل التدقيق دون صرف مالي');b.disabled=false;if(!err)load()};line.append(b)}}card.append(line)}const {data:expenses}=await db.from('solar_project_expenses').select('id,category,description,amount,currency,status,evidence_reference,review_note').eq('project_id',p.id).order('created_at',{ascending:false});card.append(el('h3','مصاريف المشروع ومراجعتها'));for(const x of expenses||[]){const line=el('article',x.category+' · '+x.amount+' '+x.currency+' · '+x.status+' — '+x.description);line.append(el('p','مرجع الإثبات: '+x.evidence_reference));if(x.review_note)line.append(el('p','المراجعة: '+x.review_note));if(x.status==='pending'){for(const [decision,title] of [['approved','اعتماد المصروف'],['rejected','رفض المصروف']]){const b=el('button',title);b.type='button';b.onclick=async()=>{const note=prompt('اكتب سبب القرار ودليل التحقق (10 أحرف على الأقل)');if(!note||note.trim().length<10)return;b.disabled=true;const {error:err}=await db.rpc('review_solar_project_expense',{p_id:x.id,p_decision:decision,p_note:note.trim()});alert(err?'تعذر القرار؛ لا يسمح باعتماد المصروف من منشئه':'تم تسجيل المراجعة');b.disabled=false;if(!err)load()};line.append(b)}}card.append(line)}const ef=el('form');ef.className='grid';const cat=el('select');for(const [v,t] of [['transport','نقل'],['materials','مواد'],['communications','اتصالات'],['service','خدمات'],['bank_fees','رسوم بنكية'],['taxes','ضرائب'],['other','أخرى']]){const o=el('option',t);o.value=v;cat.append(o)}const desc=el('textarea');desc.required=true;desc.minLength=10;desc.placeholder='وصف المصروف';const amt=el('input');amt.type='number';amt.min='0.01';amt.step='0.01';amt.required=true;amt.placeholder='المبلغ';const curr=el('input');curr.required=true;curr.maxLength=8;curr.placeholder='العملة ILS';const proof=el('input');proof.required=true;proof.minLength=8;proof.placeholder='مرجع الفاتورة أو الإثبات';const saveExpense=el('button','إضافة مصروف للمراجعة');saveExpense.type='submit';ef.append(cat,desc,amt,curr,proof,saveExpense);ef.onsubmit=async ev=>{ev.preventDefault();saveExpense.disabled=true;const {error:err}=await db.from('solar_project_expenses').insert({project_id:p.id,category:cat.value,description:desc.value.trim(),amount:Number(amt.value),currency:curr.value.trim().toUpperCase(),evidence_reference:proof.value.trim(),created_by:user.id});alert(err?'تعذر إضافة المصروف':'تم تسجيل المصروف بانتظار مراجعة مستقلة');saveExpense.disabled=false;if(!err)load()};card.append(ef);const finance=el('section');finance.append(el('h3','معاينة التوزيع المالي (بدون صرف)'));const fc=el('input');fc.placeholder='العملة ILS';fc.maxLength=8;const fb=el('button','احسب صافي المشروع');fb.type='button';const fout=el('div');fb.onclick=async()=>{const currency=fc.value.trim().toUpperCase();if(!currency)return alert('أدخل العملة');fb.disabled=true;const {data,error}=await db.rpc('preview_solar_project_finances',{p_project:p.id,p_currency:currency});fout.replaceChildren();if(error)fout.append(el('p','تعذر الحساب؛ تحقق من صلاحيات الإدارة'));else{const fields=[['gross_commissions','العمولات المطابقة'],['supervision_cost','تكلفة الإشراف'],['approved_expenses','المصاريف المعتمدة'],['pending_expenses','مصاريف قيد المراجعة'],['net_before_rewards','الصافي قبل مكافآت العاملين'],['founder_allocation','حصة المؤسس التقديرية 50%'],['worker_pool_allocation','حصة العاملين التقديرية 50%'],['approved_worker_claims','مطالبات العاملين المعتمدة'],['unallocated_worker_pool','رصيد حصة العاملين غير المخصص']];for(const [key,title] of fields)fout.append(el('p',title+': '+Number(data[key]||0).toFixed(2)+' '+currency));fout.append(el('strong',data.can_close?'المعاينة مؤهلة مبدئياً للإقفال بعد التدقيق النهائي':'غير مؤهل للإقفال: راجع الإيرادات والمصاريف المعلقة والرصيد'))}fb.disabled=false};finance.append(fc,fb,fout);card.append(finance);const closeBox=el('section');closeBox.append(el('h3','إقفال مالي بمراجعة مستقلة'));const closeCurrency=el('input');closeCurrency.placeholder='عملة الإقفال ILS';closeCurrency.maxLength=8;const prepare=el('button','إعداد مسودة إقفال');prepare.type='button';prepare.onclick=async()=>{const currency=closeCurrency.value.trim().toUpperCase();if(!currency)return alert('حدد العملة');if(!confirm('إنشاء مسودة إقفال للمراجعة؟'))return;prepare.disabled=true;const {error}=await db.rpc('prepare_solar_financial_closure',{p_project:p.id,p_currency:currency});alert(error?'تعذر إنشاء المسودة؛ تأكد من المطابقة المالية والمصاريف المعلقة وعدم وجود مسودة سابقة':'تم إنشاء مسودة إقفال للمراجعة المستقلة');prepare.disabled=false;if(!error)load()};closeBox.append(closeCurrency,prepare);const {data:closures}=await db.from('solar_project_financial_closures').select('id,currency,net_before_rewards,founder_allocation,worker_pool_allocation,status,review_note').eq('project_id',p.id);for(const x of closures||[]){const line=el('article',x.currency+' · '+x.status+' · صافي '+x.net_before_rewards+' · المؤسس '+x.founder_allocation+' · العاملون '+x.worker_pool_allocation);if(x.review_note)line.append(el('p',x.review_note));if(x.status==='draft'){for(const [decision,title] of [['approved','اعتماد الإقفال'],['rejected','رفض الإقفال']]){const b=el('button',title);b.type='button';b.onclick=async()=>{const note=prompt('سبب القرار وتوثيق المراجعة (10 أحرف على الأقل)');if(!note||note.trim().length<10)return;b.disabled=true;const {error}=await db.rpc('review_solar_financial_closure',{p_id:x.id,p_decision:decision,p_note:note.trim()});alert(error?'تعذر القرار؛ يتطلب مراجعاً مختلفاً وأرقاماً مالية غير متغيرة':'تم تسجيل قرار الإقفال دون أي صرف مالي');b.disabled=false;if(!error)load()};line.append(b)}}if(x.status==='rejected'){const reopen=el('button','إعادة إعداد الإقفال المرفوض');reopen.type='button';reopen.onclick=async()=>{const note=prompt('سبب إعادة الإعداد (10 أحرف على الأقل)');if(!note||note.trim().length<10)return;reopen.disabled=true;const {error}=await db.rpc('reopen_rejected_solar_closure',{p_id:x.id,p_note:note.trim()});alert(error?'تعذرت إعادة الإعداد؛ راجع شروط الإقفال':'تم تحديث الأرقام وإعادة الإقفال إلى مسودة للمراجعة المستقلة');reopen.disabled=false;if(!error)load()};line.append(reopen)}closeBox.append(line)}card.append(closeBox);const cf=el('form');cf.className='grid';const cfFields=[['company_name','الشركة','text'],['currency','العملة','text'],['contract_value','قيمة العقد (اختياري)','number'],['agreed_platform_commission','عمولة المنصة المتفق عليها','number'],['supervision_cost','تكلفة الإشراف من العمولة','number'],['evidence_reference','مرجع الاتفاق (اختياري)','text']];for(const [name,title,type] of cfFields){const lab=el('label',title),input=el('input');input.name=name;input.type=type;input.required=['company_name','currency','agreed_platform_commission','supervision_cost'].includes(name);if(type==='number'){input.min='0';input.step='0.01'}if(name==='supervision_cost')input.value='0';lab.append(input);cf.append(lab)}const saveC=el('button','تسجيل اتفاق العمولة (غير محصل)');saveC.type='submit';cf.append(saveC);cf.onsubmit=async ev=>{ev.preventDefault();const f=new FormData(cf);const amount=Number(f.get('agreed_platform_commission')),cost=Number(f.get('supervision_cost'));if(cost>amount){alert('تكلفة الإشراف لا يجوز أن تتجاوز العمولة');return}if(!confirm('تسجيل اتفاق عمولة دون إثبات التحصيل؟'))return;saveC.disabled=true;const contract=String(f.get('contract_value')).trim();const {error:err}=await db.from('solar_project_commission_records').insert({project_id:p.id,company_name:String(f.get('company_name')).trim(),currency:String(f.get('currency')).trim().toUpperCase(),contract_value:contract?Number(contract):null,agreed_platform_commission:amount,supervision_cost:cost,evidence_reference:String(f.get('evidence_reference')).trim()||null,created_by:user.id});alert(err?'تعذر تسجيل الاتفاق':'تم تسجيل الاتفاق بصفة غير محصل');saveC.disabled=false;if(!err)load()};card.append(cf);const assign=el('form');assign.className='grid';const uid=el('input');uid.required=true;uid.placeholder='معرّف حساب الفني أو المهندس UUID';uid.pattern='[0-9a-fA-F-]{36}';const role=el('select');for(const x of [['engineer','مهندس'],['technician','فني'],['reviewer','مراجع مستقل'],['supervisor','مشرف']]){const o=el('option',x[1]);o.value=x[0];role.append(o)}const submit=el('button','تعيين العامل');submit.type='submit';assign.append(uid,role,submit);card.append(assign);assign.onsubmit=async ev=>{ev.preventDefault();if(!confirm('تعيين الحساب المحدد على هذا المشروع؟'))return;submit.disabled=true;const {error:err}=await db.from('solar_project_assignments').insert({project_id:p.id,worker_id:uid.value.trim(),assigned_by:user.id,role:role.value});alert(err?'تعذر التعيين. تحقق من الصلاحيات ومعرف العامل وعدم تكرار التكليف.':'تم التعيين');submit.disabled=false;if(!err)load()};const statusForm=el('form');const status=el('select');for(const s of ['pending','reviewing','needs_info','quoted','closed','cancelled']){const o=el('option',s);o.value=s;if(s===p.status)o.selected=true;status.append(o)}const update=el('button','حفظ حالة المشروع');update.type='submit';statusForm.append(status,update);card.append(statusForm);statusForm.onsubmit=async ev=>{ev.preventDefault();if(!confirm('تغيير حالة المشروع؟'))return;update.disabled=true;const {error:err}=await db.from('solar_project_requests').update({status:status.value}).eq('id',p.id);alert(err?'تعذر تغيير الحالة':'تم تحديث الحالة');update.disabled=false;if(!err)load()}}}init()})();</script></body></html>
