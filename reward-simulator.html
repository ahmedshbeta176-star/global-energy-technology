<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محاكاة مكافآت المساهمين</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font:16px Tahoma,Arial;line-height:1.8}main{max-width:800px;margin:auto;padding:20px}a,h1,h2{color:#35c9a0}section{background:#1c2b40;padding:18px;border-radius:12px;margin:12px 0}input,select{display:block;width:100%;padding:10px;background:#101827;color:white;border:1px solid #52647a;border-radius:8px;font:inherit}label{display:block;margin:12px 0}output{font-size:28px;color:#35c9a0}</style><main><a href="operations.html">مركز التشغيل</a> · <a href="vip.html">حساب المساهم</a><h1>محاكاة النقاط والأرباح</h1><section>هذه أداة اختبار وليست رصيداً أو استحقاقاً مالياً. لا تُحفظ المدخلات ولا تُنفذ مدفوعات.</section><section><label>صافي الربح القابل للتوزيع بالدولار<input id="profit" type="number" min="0" step="0.01" value="1000"></label><label>نقاط العامل المعتمدة<input id="points" type="number" min="0" step="1" value="100"></label><label>المستوى المقترح<select id="level"></select></label><label>نقاط بقية العاملين بعد الترجيح<input id="others" type="number" min="0" step="0.01" value="900"></label><p id="pool"></p><p id="weighted"></p><p>حصة العامل التقديرية: <output id="result">—</output></p><p id="status" role="status"></p></section><section><h2>أنواع المهام المقترحة</h2><div id="tasks"></div></section></main><script>const $=id=>document.getElementById(id);let policy,profitPolicy;function calc(){if(!policy||!profitPolicy)return;const values=['profit','points','others'].map(id=>Number($(id).value));if(values.some(x=>!Number.isFinite(x)||x<0)||!Number.isInteger(values[1])){$('result').textContent='—';$('status').textContent='أدخل قيماً صحيحة غير سالبة';return}const [profit,points,others]=values,level=policy.levels.find(x=>x.id===$('level').value);if(!level)return;const pool=profit*profitPolicy.net_profit_distribution.eligible_workers_pool_percent/100,w=points*level.multiplier,total=w+others;$('pool').textContent='صندوق العاملين: '+pool.toFixed(2)+' USD';$('weighted').textContent='النقاط المرجحة: '+w.toFixed(2);$('result').textContent=total?(pool*w/total).toFixed(2)+' USD':'—';$('status').textContent=total?'محاكاة فقط':'لا توجد نقاط مؤهلة؛ يبقى الصندوق للمراجعة'}Promise.all(['work-rewards-policy.json','profit-policy.json'].map(p=>fetch(p).then(r=>{if(!r.ok)throw Error();return r.json()}))).then(([a,b])=>{policy=a;profitPolicy=b;const names={starter:'مبتدئ',active:'نشط',advanced:'متقدم',professional:'محترف',distinguished:'متميز'};for(const l of a.levels){const o=document.createElement('option');o.value=l.id;o.textContent=names[l.id]+' ×'+l.multiplier;$('level').append(o)}for(const t of a.task_types){const p=document.createElement('p');p.textContent=t.name+' — '+t.points+' نقطة';$('tasks').append(p)}calc()}).catch(()=>{$('status').textContent='تعذر تحميل القواعد'});for(const id of ['profit','points','others','level'])$(id).addEventListener('input',calc);</script></html>
