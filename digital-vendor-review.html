<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة طلبات التطبيقات | GLOBAL ENERGY</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font:15px Tahoma,Arial;line-height:1.8}header{background:#17243a;padding:16px;border-bottom:2px solid #35c9a0}main{max-width:860px;margin:auto;padding:20px}h1,h2,a{color:#35c9a0}.panel{background:#1b2b40;border:1px solid #3a4b63;border-radius:12px;padding:20px;margin:15px 0}label{display:block;margin:12px 0}input,textarea,select{width:100%;background:#0f1b2b;border:1px solid #60738b;color:white;border-radius:8px;padding:11px;font:inherit}button{background:#35c9a0;border:0;border-radius:8px;padding:11px 18px;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.muted{color:#cbd4e0}.error{color:#ffb9b9}.ok{color:#9deccf}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:13px}article{overflow-wrap:anywhere}</style></head><body><header><strong>GLOBAL ENERGY & TECHNOLOGY</strong> · <a href="sections.html">الأقسام</a> · <a href="digital-vendor-apply.html">تقديم طلب</a> · <a href="digital-vendor-products-review.html">مراجعة المنتجات</a> · <a href="digital-vendor-products-review.html">مراجعة المنتجات</a></header><main><h1>مراجعة طلبات أصحاب التطبيقات</h1><p class="muted">صفحة إدارية محمية بصلاحية خادم مستقلة. الموافقة على الطلب لا تفعّل الدفع أو نشر المنتجات تلقائياً.</p><p id="status" role="status">جارٍ التحقق من الصلاحية...</p><div id="queue"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient("https://dagjfsqnfrzcmtjqmypy.supabase.co","sb_publishable_Ca6rTp5OS9IxNJ0jnnaYvQ_lNRanlDK");</script><script>const $=id=>document.getElementById(id);const statuses={pending:'قيد المراجعة',needs_changes:'مطلوب تعديل',approved:'مقبول',rejected:'مرفوض',suspended:'معلق'};function line(parent,label,value){const p=document.createElement('p');const b=document.createElement('b');b.textContent=label+': ';p.append(b,document.createTextNode(value||'—'));parent.append(p)}async function load(){const {data:{user}}=await db.auth.getUser();if(!user){$('status').innerHTML='يجب <a href="login.html">تسجيل الدخول</a> بحساب إداري مخوّل.';return}const {data,error}=await db.rpc('digital_vendor_review_queue');if(error){$('status').textContent='لا توجد صلاحية إدارية لهذا الحساب أو تعذّر تحميل الطلبات.';return}$('status').textContent='طلبات المراجعة: '+data.length;$('queue').replaceChildren();for(const item of data){const card=document.createElement('article');card.className='panel';line(card,'التطبيق',item.app_name);line(card,'الشركة',item.company_name);line(card,'الدولة',item.country_code);line(card,'التواصل',item.contact_email);line(card,'حالة الطلب',statuses[item.status]||item.status);line(card,'إثبات التفويض',item.authorization_evidence);line(card,'ملاحظات سابقة',item.review_notes);const notes=document.createElement('textarea');notes.placeholder='ملاحظات المراجعة';notes.rows=2;card.append(notes);const actions=document.createElement('div');actions.className='actions';for(const [key,label] of [['approved','موافقة مبدئية'],['needs_changes','طلب تعديل'],['rejected','رفض'],['suspended','تعليق']]){const btn=document.createElement('button');btn.textContent=label;btn.addEventListener('click',async()=>{if(!confirm('تأكيد قرار: '+label+'؟'))return;btn.disabled=true;const {error}=await db.rpc('digital_vendor_review',{p_application_id:item.id,p_decision:key,p_notes:notes.value});if(error){alert('لم يتم الحفظ: '+error.message);btn.disabled=false}else await load()});actions.append(btn)}card.append(actions);$('queue').append(card)}}load();</script></body></html>
