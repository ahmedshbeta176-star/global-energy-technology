<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="تسجيل الدخول إلى GLOBAL ENERGY & TECHNOLOGY">
<title>تسجيل الدخول | GLOBAL ENERGY</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#101827;color:#fff;font-family:Tahoma,Arial,sans-serif;line-height:1.8}
main{width:min(100%,440px);background:#1c2b40;border:1px solid #30445c;border-radius:16px;padding:28px}
h1{font-size:23px;color:#35c9a0;margin:0 0 6px}
p{color:#c5cfdd}
label{display:block;margin:14px 0 5px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #52647a;background:#101827;color:white;font:inherit}
button,.link{display:inline-block;width:100%;margin-top:14px;padding:12px;border:0;border-radius:8px;background:#35c9a0;color:#10202a;font:inherit;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer}
button.secondary{background:transparent;border:1px solid #35c9a0;color:#35c9a0}
button:disabled{opacity:.6;cursor:wait}
#message{min-height:48px;margin-top:14px;font-size:14px;color:#f4c66b;white-space:pre-wrap}
.small{font-size:12px;color:#aebdcd}
</style>
</head>
<body>
<main>
<h1>GLOBAL ENERGY & TECHNOLOGY</h1>
<p>تسجيل الدخول إلى حسابك</p>
<form id="loginForm">
<label for="email">البريد الإلكتروني</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="loginButton" type="submit">تسجيل الدخول</button>
</form>
<button class="secondary" id="resetButton" type="button">إرسال رابط إعادة تعيين كلمة المرور</button>
<button class="secondary" id="logoutButton" type="button" hidden>تسجيل الخروج</button>
<div id="message" role="status" aria-live="polite"></div>
<p class="small">تسجيل الدخول لا يمنح صلاحيات إدارية تلقائياً. سيتم تفعيل الوصول إلى أقسام المنصة بعد استكمال التحقق من الأدوار وسياسات قاعدة البيانات.</p>
<a class="link" href="index.html">العودة إلى الصفحة الرئيسية</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://dagjfsqnfrzcmtjqmypy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Ca6rTp5OS9IxNJ0jnnaYvQ_lNRanlDK";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const form=document.getElementById("loginForm");
const message=document.getElementById("message");
const loginButton=document.getElementById("loginButton");
const logoutButton=document.getElementById("logoutButton");
function show(text){message.textContent=text;}
async function refreshSession(){
 const {data,error}=await client.auth.getSession();
 if(error){show("تعذر التحقق من الجلسة. حاول تحديث الصفحة.");return;}
 if(data.session){
  show("تم تسجيل الدخول للحساب: "+data.session.user.email+"\nهذا يؤكد الجلسة فقط، ولا يعني منح صلاحيات إدارية.");
  logoutButton.hidden=false;
 }else{
  logoutButton.hidden=true;
  show("لم يتم تسجيل الدخول حالياً.");
 }
}
form.addEventListener("submit",async event=>{
 event.preventDefault();
 loginButton.disabled=true;
 show("جارٍ التحقق من بيانات الدخول...");
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {error}=await client.auth.signInWithPassword({email,password});
 loginButton.disabled=false;
 if(error){show("تعذر تسجيل الدخول. تحقق من البريد وكلمة المرور، أو استخدم إعادة تعيين كلمة المرور.");return;}
 document.getElementById("password").value="";
 await refreshSession();
});
document.getElementById("resetButton").addEventListener("click",async()=>{
 const email=document.getElementById("email").value.trim();
 if(!email){show("اكتب بريدك الإلكتروني أولاً ثم اضغط إعادة التعيين.");return;}
 const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+"/login.html"});
 show(error?"تعذر إرسال رابط إعادة التعيين. حاول لاحقاً.":"إذا كان البريد مسجلاً، فستصلك رسالة تتضمن رابط إعادة تعيين كلمة المرور.");
});
logoutButton.addEventListener("click",async()=>{
 const {error}=await client.auth.signOut();
 show(error?"تعذر تسجيل الخروج.":"تم تسجيل الخروج.");
 await refreshSession();
});
refreshSession();
</script>
</body>
</html>
