<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تسجيل الدخول | GLOBAL ENERGY</title>
<style>body{background:#101827;color:white;font-family:Tahoma,Arial;margin:0;padding:24px}main{max-width:420px;margin:7vh auto;background:#17243a;border-radius:12px;padding:24px}h1,a{color:#35c9a0}label{display:block;margin-top:14px}input{box-sizing:border-box;width:100%;padding:12px;margin-top:5px;background:#101827;color:white;border:1px solid #52647a;border-radius:6px}button:disabled{opacity:.5;cursor:not-allowed}button{padding:12px;margin:14px 5px 0 0;background:#35c9a0;border:0;border-radius:6px;cursor:pointer}#status{line-height:1.8}</style></head>
<body><main><a href="index.html">الرئيسية</a><h1>تسجيل الدخول</h1>
<form id="form"><label>البريد الإلكتروني<input id="email" type="email" required autocomplete="email"></label><label>كلمة المرور<input id="password" type="password" minlength="6" required autocomplete="current-password"></label><button type="submit">دخول</button><button type="button" id="signup">إنشاء حساب</button><button type="button" id="reset">استعادة كلمة المرور</button><button type="button" id="resend" hidden>إعادة إرسال تأكيد البريد</button></form>
<div id="recovery" hidden><label>كلمة المرور الجديدة<input id="newPassword" type="password" minlength="8" autocomplete="new-password"></label><button type="button" id="savePassword">حفظ كلمة المرور الجديدة</button></div><div id="account" hidden><p id="who"></p><a href="monitoring.html">مراقبة المحطات</a><button id="logout">خروج</button></div><p id="status" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const status=document.getElementById('status'),form=document.getElementById('form'),account=document.getElementById('account'),email=document.getElementById('email'),password=document.getElementById('password');
if(!window.supabase){status.textContent='تعذر تحميل مكتبة تسجيل الدخول';}else{
const db=window.supabase.createClient('https://dagjfsqnfrzcmtjqmypy.supabase.co','sb_publishable_Ca6rTp5OS9IxNJ0jnnaYvQ_lNRanlDK');
function show(user){form.hidden=!!user||recovering;account.hidden=!user||recovering;document.getElementById('who').textContent=user?'تم الدخول: '+user.email:'';if(user){resend.hidden=true;status.textContent='';}}
const resend=document.getElementById('resend');const signup=document.getElementById('signup');const reset=document.getElementById('reset');const submit=form.querySelector('button[type=submit]');const cooldownKey='global_energy_email_request_cooldown_v2';let busy=false;let recovering=false;const redirectUrl=location.origin+location.pathname;function cooldownRemaining(){try{return Math.max(0,Number(localStorage.getItem(cooldownKey)||0)-Date.now());}catch(e){return 0;}}function setCooldown(){try{localStorage.setItem(cooldownKey,String(Date.now()+10*60*1000));}catch(e){}}function cooldownMessage(){const mins=Math.ceil(cooldownRemaining()/60000);return mins?'لمنع تكرار إرسال البريد، انتظر حوالي '+mins+' دقيقة قبل طلب رسالة جديدة.':'يمكنك المحاولة الآن، لكن قد يظل حد الإرسال لدى خدمة البريد قائماً.';}function updateButtons(){[signup,reset,resend,submit].forEach(b=>b.disabled=busy);signup.disabled=busy||cooldownRemaining()>0;reset.disabled=busy;resend.disabled=busy||cooldownRemaining()>0;}updateButtons();const recovery=document.getElementById('recovery');
function message(e){const m=(e?.message||'').toLowerCase();if(m.includes('email not confirmed')){resend.hidden=false;updateButtons();return 'حسابك موجود لكن البريد غير مؤكد. افحص البريد غير المرغوب فيه أو اضغط إعادة إرسال التأكيد.';}if(m.includes('rate limit')||e?.status===429){setCooldown();updateButtons();return 'خدمة البريد وصلت إلى حد الإرسال. '+cooldownMessage()+' لا تنشئ حساباً جديداً.';}if(m.includes('email address')&&m.includes('invalid'))return 'رفض خادم تسجيل الدخول هذا البريد، رغم أن صياغته قد تكون صحيحة. لا تكرر المحاولة الآن؛ نحتاج مراجعة إعدادات البريد في Supabase.';if(m.includes('invalid login credentials'))return 'البريد أو كلمة المرور غير صحيحة. استخدم استعادة كلمة المرور إن نسيتها.';return e?.message||'حدث خطأ، حاول لاحقاً';}
async function action(fn){if(busy)return null;busy=true;updateButtons();status.textContent='يرجى الانتظار...';try{const {data,error}=await fn();if(error)throw error;status.textContent='تم تنفيذ الطلب';return data;}catch(e){status.textContent=message(e);return null;}finally{busy=false;updateButtons();}}
resend.onclick=async()=>{if(!email.reportValidity())return;if(cooldownRemaining()){status.textContent=cooldownMessage();return;}const data=await action(()=>db.auth.resend({type:'signup',email:email.value.trim(),options:{emailRedirectTo:redirectUrl}}));if(data){setCooldown();updateButtons();status.textContent='تم قبول طلب الإرسال. افحص البريد والرسائل المزعجة؛ قبول الطلب لا يضمن وصول الرسالة.';}};
db.auth.getUser().then(({data})=>show(data.user));db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){recovering=true;form.hidden=true;account.hidden=true;recovery.hidden=false;status.textContent='أدخل كلمة مرور جديدة ثم احفظها.';}else if(!recovering)show(session?.user||null);});
document.getElementById('savePassword').onclick=async()=>{const input=document.getElementById('newPassword');if(!input.reportValidity())return;const data=await action(()=>db.auth.updateUser({password:input.value}));if(data){input.value='';recovering=false;recovery.hidden=true;const {data:current}=await db.auth.getUser();show(current.user);status.textContent='تم تغيير كلمة المرور بنجاح.';}};
form.addEventListener('submit',async e=>{e.preventDefault();await action(()=>db.auth.signInWithPassword({email:email.value.trim(),password:password.value}));});
document.getElementById('signup').onclick=async()=>{if(!form.reportValidity())return;if(cooldownRemaining()){status.textContent=cooldownMessage();return;}const data=await action(()=>db.auth.signUp({email:email.value.trim(),password:password.value,options:{emailRedirectTo:redirectUrl}}));if(data){setCooldown();updateButtons();resend.hidden=!!data.session;status.textContent=data.session?'تم إنشاء الحساب وتسجيل الدخول':'تم تسجيل الطلب. افحص بريدك لتأكيد الحساب، ويمكنك إعادة إرسال التأكيد عند الحاجة.';}};
document.getElementById('reset').onclick=async()=>{if(!email.reportValidity())return;const result=await action(()=>db.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:redirectUrl}));if(result){setCooldown();updateButtons();status.textContent='تم قبول طلب الاستعادة؛ افحص الوارد والرسائل المزعجة.';}};
document.getElementById('logout').onclick=()=>action(()=>db.auth.signOut());
}</script></body></html>
