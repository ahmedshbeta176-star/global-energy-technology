<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تسجيل الدخول | GLOBAL ENERGY</title>
<style>body{background:#101827;color:white;font-family:Tahoma,Arial;margin:0;padding:24px}main{max-width:420px;margin:7vh auto;background:#17243a;border-radius:12px;padding:24px}h1,a{color:#35c9a0}label{display:block;margin-top:14px}input{box-sizing:border-box;width:100%;padding:12px;margin-top:5px;background:#101827;color:white;border:1px solid #52647a;border-radius:6px}button{padding:12px;margin:14px 5px 0 0;background:#35c9a0;border:0;border-radius:6px;cursor:pointer}#status{line-height:1.8}</style></head>
<body><main><a href="index.html">الرئيسية</a><h1>تسجيل الدخول</h1>
<form id="form"><label>البريد الإلكتروني<input id="email" type="email" required autocomplete="email"></label><label>كلمة المرور<input id="password" type="password" minlength="6" required autocomplete="current-password"></label><button type="submit">دخول</button><button type="button" id="signup">إنشاء حساب</button><button type="button" id="reset">استعادة كلمة المرور</button></form>
<div id="account" hidden><p id="who"></p><a href="monitoring.html">مراقبة المحطات</a><button id="logout">خروج</button></div><p id="status" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const status=document.getElementById('status'),form=document.getElementById('form'),account=document.getElementById('account'),email=document.getElementById('email'),password=document.getElementById('password');
if(!window.supabase){status.textContent='تعذر تحميل مكتبة تسجيل الدخول';}else{
const db=window.supabase.createClient('https://dagjfsqnfrzcmtjqmypy.supabase.co','sb_publishable_Ca6rTp5OS9IxNJ0jnnaYvQ_lNRanlDK');
function show(user){form.hidden=!!user;account.hidden=!user;document.getElementById('who').textContent=user?'تم الدخول: '+user.email:'';}
async function action(fn){status.textContent='يرجى الانتظار...';try{const {data,error}=await fn();if(error)throw error;status.textContent='تم تنفيذ الطلب';return data;}catch(e){status.textContent=e.message;}}
db.auth.getUser().then(({data})=>show(data.user));db.auth.onAuthStateChange((_event,session)=>show(session?.user||null));
form.addEventListener('submit',async e=>{e.preventDefault();await action(()=>db.auth.signInWithPassword({email:email.value.trim(),password:password.value}));});
document.getElementById('signup').onclick=async()=>{if(!form.reportValidity())return;const data=await action(()=>db.auth.signUp({email:email.value.trim(),password:password.value,options:{emailRedirectTo:location.href}}));if(data)status.textContent=data.session?'تم إنشاء الحساب':'راجع بريدك لتأكيد الحساب إن كان التسجيل متاحاً';};
document.getElementById('reset').onclick=async()=>{if(!email.reportValidity())return;await action(()=>db.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.href}));status.textContent='إذا كان البريد مسجلاً، ستصلك رسالة استعادة كلمة المرور';};
document.getElementById('logout').onclick=()=>action(()=>db.auth.signOut());
}</script></body></html>
