<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المتجر | GLOBAL ENERGY & TECHNOLOGY</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:Tahoma,Arial,sans-serif;line-height:1.8}header{padding:18px;background:#17243a;border-bottom:2px solid #35c9a0}main{max-width:1050px;margin:auto;padding:20px}h1,h2{color:#35c9a0}.muted{color:#c6d2df}.panel{background:#1c2b40;border:1px solid #30445c;border-radius:12px;padding:18px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}label{display:block;margin:10px 0}input,select,textarea{width:100%;padding:11px;background:#101827;color:white;border:1px solid #52647a;border-radius:7px}button,.btn{background:#35c9a0;color:#10202a;border:0;border-radius:7px;padding:10px 16px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5;cursor:not-allowed}a{color:#35c9a0}.card{background:#17243a;border:1px solid #30445c;border-radius:10px;padding:16px;overflow-wrap:anywhere}.small{font-size:13px}</style></head><body><header>GLOBAL ENERGY & TECHNOLOGY · <a href="index.html">الرئيسية</a> · <a href="services.html">دليل الخدمات</a> · <a href="login.html">الحساب</a></header><main><h1>متجر الطاقة والتكنولوجيا</h1><p>تواصل مباشرة مع التاجر. لا يتم الدفع عبر المنصة.</p><section class="panel"><h2>المنتجات المنشورة</h2><div class="grid"><label>بحث<input id="search"></label><label>الدولة<input id="country"></label><label>التصنيف<select id="category"><option value="">الكل</option><option>ألواح شمسية</option><option>إنفرترات</option><option>بطاريات</option><option>ملحقات</option><option>أخرى</option></select></label></div><p id="count" role="status"></p><div id="products" class="grid"></div></section><section class="panel"><h2>حساب التاجر</h2><p id="account"></p><form id="shop" hidden><label>اسم المتجر<input id="shopName" required maxlength="100"></label><label>الدولة<input id="shopCountry" required maxlength="80"></label><label>المدينة<input id="city" required maxlength="80"></label><label>هاتف التواصل العام<input id="phone" type="tel" required maxlength="30"></label><label>وصف المتجر<textarea id="shopDesc" maxlength="1000"></textarea></label><button>إرسال للمراجعة</button></form><form id="product" hidden><h3>إضافة منتج</h3><label>الاسم<input id="title" required maxlength="100"></label><label>التصنيف<select id="type"><option>ألواح شمسية</option><option>إنفرترات</option><option>بطاريات</option><option>ملحقات</option><option>أخرى</option></select></label><label>السعر<input id="price" type="number" min="0" step=".01" required></label><label>العملة<select id="currency"><option>ILS</option><option>USD</option><option>JOD</option><option>EUR</option></select></label><label>الوصف<textarea id="description" maxlength="1000"></textarea></label><label>رفع صورة المنتج من الهاتف (JPG / PNG / WebP، حتى 5MB)<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"></label><label>أو رابط صورة المنتج (HTTPS)<input id="imageUrl" type="url" maxlength="1500" placeholder="https://example.com/product.jpg"></label><button>حفظ مسودة</button></form><p id="notice" role="status"></p><div id="mine"></div></section><section class="panel"><h2>استفسارات المنتجات</h2><form id="inquiry" hidden><p id="inquiryTitle"></p><input type="hidden" id="inquiryProduct"><label>رسالتك<textarea id="inquiryMessage" required maxlength="1000"></textarea></label><button>إرسال الاستفسار</button></form><p id="inquiryNotice" role="status"></p><div id="inquiries"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id);async function uploadProductImage(file){if(!file)return null;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5242880||!file.size)throw Error('الصورة يجب أن تكون JPG أو PNG أو WebP وحجمها أقل من 5MB');if(!user)throw Error('يجب تسجيل الدخول');const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];const path=user.id+'/'+crypto.randomUUID()+'.'+ext;const result=await db.storage.from('marketplace-product-images').upload(path,file,{contentType:file.type,upsert:false});if(result.error)throw result.error;return db.storage.from('marketplace-product-images').getPublicUrl(path).data.publicUrl;}let db,user,shops=[],products=[],own=[];const node=(tag,t)=>{const e=document.createElement(tag);e.textContent=t;return e};
function render(){const root=$('products');root.replaceChildren();let n=0;for(const p of products){const s=shops.find(x=>x.id===p.shop_id);if(!s||!s.country.toLowerCase().includes($('country').value.trim().toLowerCase())||!((p.title+' '+p.description).toLowerCase().includes($('search').value.trim().toLowerCase()))||($('category').value&&p.category!==$('category').value))continue;n++;const card=node('article','');card.className='card';if(p.image_url){const img=document.createElement('img');img.src=p.image_url;img.alt=p.title;img.loading='lazy';img.referrerPolicy='no-referrer';img.style.cssText='width:100%;max-height:200px;object-fit:contain;border-radius:8px';card.append(img)}card.append(node('h3',p.title),node('p',p.category+' | '+p.price+' '+p.currency),node('p',p.description),node('p',s.shop_name+' — '+s.city+'، '+s.country));const phone=s.contact_phone.replace(/[^+0-9]/g,'');if(phone){const a=node('a','اتصل بالتاجر');a.href='tel:'+phone;card.append(a)}const b=node('button','استفسار عن المنتج');b.type='button';b.onclick=()=>{if(!user){location.href='login.html';return}$('inquiryProduct').value=p.id;$('inquiryTitle').textContent=p.title;$('inquiry').hidden=false;$('inquiry').scrollIntoView({behavior:'smooth'})};card.append(b);root.append(card)}$('count').textContent=n?'عدد المنتجات: '+n:'لا توجد منتجات منشورة مطابقة حالياً.'}
async function catalog(){const [s,p]=await Promise.all([db.from('marketplace_shops').select('id,shop_name,country,city,contact_phone').eq('status','approved').limit(500),db.from('marketplace_products').select('id,shop_id,title,category,description,price,currency,image_url').eq('status','published').limit(500)]);if(s.error||p.error){$('count').textContent='تعذر تحميل المتجر';return}shops=s.data||[];products=p.data||[];render()}
async function account(){const {data,error}=await db.auth.getUser();user=error?null:data.user;if(!user){$('account').textContent='سجل الدخول لإنشاء متجر.';return}const r=await db.from('marketplace_shops').select('id,shop_name,status').eq('owner_id',user.id);if(r.error){$('account').textContent='تعذر تحميل حساب التاجر';return}own=r.data||[];$('shop').hidden=own.length>0;$('account').textContent=own.length?own.map(s=>s.shop_name+' — '+s.status).join(' | '):'أنشئ متجرك لإرساله للمراجعة';$('product').hidden=own.filter(s=>s.status==='approved').length!==1;const m=await db.from('marketplace_products').select('id,title,status,price,currency,image_url,description,category').in('shop_id',own.map(s=>s.id));$('mine').replaceChildren();if(!m.error)for(const p of m.data||[]){const row=node('p',p.title+' — '+p.status+' ');if(p.status==='draft'||p.status==='published'){const edit=node('button','تعديل المنتج');edit.type='button';edit.onclick=async()=>{const title=prompt('اسم المنتج',p.title);if(title===null)return;const price=prompt('السعر',p.price);if(price===null)return;const value=Number(price);if(!title.trim()||!Number.isFinite(value)||value<0){$('notice').textContent='الاسم أو السعر غير صالح';return}const image_url=prompt('رابط الصورة HTTPS (اتركه فارغاً لإزالتها)',p.image_url||'');if(image_url===null)return;if(image_url.trim()&&!/^https:\/\/[^\s]+$/i.test(image_url.trim())){$('notice').textContent='رابط الصورة يجب أن يبدأ بـ HTTPS';return}edit.disabled=true;const {error}=await db.from('marketplace_products').update({title:title.trim(),price:value,image_url:image_url.trim()||null}).eq('id',p.id);$('notice').textContent=error?'تعذر تعديل المنتج: '+error.message:'تم حفظ التعديل';edit.disabled=false;if(!error){await account();await catalog()}};row.append(edit);const b=node('button',p.status==='draft'?'نشر المنتج':'إلغاء النشر');b.type='button';b.onclick=async()=>{b.disabled=true;try{const {data,error}=await db.from('marketplace_products').update({status:p.status==='draft'?'published':'draft'}).eq('id',p.id).select('id');$('notice').textContent=error||!data?.length?'تعذر تغيير حالة المنتج':'تم تحديث حالة المنتج';await account();await catalog()}finally{b.disabled=false}};row.append(b)}$('mine').append(row)}}
async function submit(e,table,row){e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const {error}=await db.from(table).insert(row);$('notice').textContent=error?'تعذر الحفظ. تحقق من البيانات والصلاحيات.':'تم الحفظ بنجاح';if(!error){e.target.reset();await account()}}finally{b.disabled=false}}
$('shop').onsubmit=e=>{e.preventDefault();if(user)submit(e,'marketplace_shops',{owner_id:user.id,shop_name:$('shopName').value.trim(),country:$('shopCountry').value.trim(),city:$('city').value.trim(),contact_phone:$('phone').value.trim(),description:$('shopDesc').value.trim(),status:'pending'})};
$('product').onsubmit=e=>{e.preventDefault();const s=own.filter(s=>s.status==='approved');if(user&&s.length===1)(async()=>{const btn=e.target.querySelector('button');btn.disabled=true;try{const image_url=$('imageFile').files[0]?await uploadProductImage($('imageFile').files[0]):$('imageUrl').value.trim()||null;const {error}=await db.from('marketplace_products').insert({shop_id:s[0].id,title:$('title').value.trim(),category:$('type').value,price:Number($('price').value),currency:$('currency').value,description:$('description').value.trim(),image_url,status:'draft'});$('notice').textContent=error?'تعذر حفظ المنتج: '+error.message:'تم حفظ المنتج كمسودة';if(!error){e.target.reset();await account();await catalog()}}catch(err){$('notice').textContent='تعذر رفع الصورة: '+err.message}finally{btn.disabled=false}})()};
for(const id of ['search','country','category'])$(id).addEventListener('input',render);
if(window.supabase){db=window.supabase.createClient('https://dagjfsqnfrzcmtjqmypy.supabase.co','sb_publishable_Ca6rTp5OS9IxNJ0jnnaYvQ_lNRanlDK');catalog();account().then(loadInquiries)}else $('count').textContent='الاتصال غير متاح';
async function loadInquiries(){if(!user)return;const {data,error}=await db.from('marketplace_inquiries').select('message,status,created_at,buyer_id,product_id').order('created_at',{ascending:false}).limit(100);$('inquiries').replaceChildren();if(error){$('inquiries').textContent='تعذر تحميل الاستفسارات';return}for(const i of data||[]){$('inquiries').append(node('p',(i.buyer_id===user.id?'صادر: ':'وارد: ')+i.message+' — '+i.status))}}
$('inquiry').onsubmit=async e=>{e.preventDefault();if(!user)return;const b=e.target.querySelector('button');b.disabled=true;try{const {error}=await db.from('marketplace_inquiries').insert({product_id:$('inquiryProduct').value,buyer_id:user.id,message:$('inquiryMessage').value.trim(),status:'new'});$('inquiryNotice').textContent=error?'تعذر إرسال الاستفسار':'تم إرسال الاستفسار';if(!error){e.target.reset();e.target.hidden=true;await loadInquiries()}}finally{b.disabled=false}};
</script></body></html>
