<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المتجر | GLOBAL ENERGY & TECHNOLOGY</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:Tahoma,Arial,sans-serif;line-height:1.8}header{padding:18px;background:#17243a;border-bottom:2px solid #35c9a0}main{max-width:1050px;margin:auto;padding:20px}h1,h2{color:#35c9a0}.muted{color:#c6d2df}.panel{background:#1c2b40;border:1px solid #30445c;border-radius:12px;padding:18px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}label{display:block;margin:10px 0}input,select,textarea{width:100%;padding:11px;background:#101827;color:white;border:1px solid #52647a;border-radius:7px}button,.btn{background:#35c9a0;color:#10202a;border:0;border-radius:7px;padding:10px 16px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5;cursor:not-allowed}a{color:#35c9a0}.card{background:#17243a;border:1px solid #30445c;border-radius:10px;padding:16px;overflow-wrap:anywhere}.small{font-size:13px}</style></head><body><header>GLOBAL ENERGY & TECHNOLOGY · <a href="index.html">الرئيسية</a> · <a href="services.html">دليل الخدمات</a> · <a href="login.html">الحساب</a></header><main><h1>متجر الطاقة والتكنولوجيا</h1><p>تواصل مباشرة مع التاجر. لا يتم الدفع عبر المنصة.</p><section class="panel"><h2>المنتجات المنشورة</h2><div class="grid"><label>بحث<input id="search"></label><label>الدولة<input id="country"></label><label>التصنيف<select id="category"><option value="">الكل</option><option>ألواح شمسية</option><option>إنفرترات</option><option>بطاريات</option><option>ملحقات</option><option>أخرى</option></select></label></div><p id="count" role="status"></p><div id="products" class="grid"></div></section><section class="panel"><h2>حساب التاجر</h2><p id="account"></p><form id="shop" hidden><label>اسم المتجر<input id="shopName" required maxlength="100"></label><label>الدولة<input id="shopCountry" required maxlength="80"></label><label>المدينة<input id="city" required maxlength="80"></label><label>هاتف التواصل العام<input id="phone" type="tel" required maxlength="30"></label><label>وصف المتجر<textarea id="shopDesc" maxlength="1000"></textarea></label><button>إرسال للمراجعة</button></form><form id="product" hidden><h3>إضافة منتج</h3><label>الاسم<input id="title" required maxlength="100"></label><label>التصنيف<select id="type"><option>ألواح شمسية</option><option>إنفرترات</option><option>بطاريات</option><option>ملحقات</option><option>أخرى</option></select></label><label>السعر<input id="price" type="number" min="0" step=".01" required></label><label>العملة<select id="currency"><option>ILS</option><option>USD</option><option>JOD</option><option>EUR</option></select></label><label>الوصف<textarea id="description" maxlength="1000"></textarea></label><button>حفظ مسودة</button></form><p id="notice" role="status"></p><div id="mine"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id);let db,user,shops=[],products=[],own=[];const node=(tag,t)=>{const e=document.createElement(tag);e.textContent=t;return e};
function render(){const root=$('products');root.replaceChildren();let n=0;for(const p of products){const s=shops.find(x=>x.id===p.shop_id);if(!s||!s.country.toLowerCase().includes($('country').value.trim().toLowerCase())||!((p.title+' '+p.description).toLowerCase().includes($('search').value.trim().toLowerCase()))||($('category').value&&p.category!==$('category').value))continue;n++;const card=node('article','');card.className='card';card.append(node('h3',p.title),node('p',p.category+' | '+p.price+' '+p.currency),node('p',p.description),node('p',s.shop_name+' — '+s.city+'، '+s.country));const phone=s.contact_phone.replace(/[^+0-9]/g,'');if(phone){const a=node('a','اتصل بالتاجر');a.href='tel:'+phone;card.append(a)}root.append(card)}$('count').textContent=n?'عدد المنتجات: '+n:'لا توجد منتجات منشورة مطابقة حالياً.'}
async function catalog(){const [s,p]=await Promise.all([db.from('marketplace_shops').select('id,shop_name,country,city,contact_phone').eq('status','approved').limit(500),db.from('marketplace_products').select('id,shop_id,title,category,description,price,currency').eq('status','published').limit(500)]);if(s.error||p.error){$('count').textContent='تعذر تحميل المتجر';return}shops=s.data||[];products=p.data||[];render()}
async function account(){const {data,error}=await db.auth.getUser();user=error?null:data.user;if(!user){$('account').textContent='سجل الدخول لإنشاء متجر.';return}const r=await db.from('marketplace_shops').select('id,shop_name,status').eq('owner_id',user.id);if(r.error){$('account').textContent='تعذر تحميل حساب التاجر';return}own=r.data||[];$('shop').hidden=own.length>0;$('account').textContent=own.length?own.map(s=>s.shop_name+' — '+s.status).join(' | '):'أنشئ متجرك لإرساله للمراجعة';$('product').hidden=own.filter(s=>s.status==='approved').length!==1;const m=await db.from('marketplace_products').select('title,status').in('shop_id',own.map(s=>s.id));$('mine').replaceChildren();if(!m.error)for(const p of m.data||[])$('mine').append(node('p',p.title+' — '+p.status))}
async function submit(e,table,row){e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const {error}=await db.from(table).insert(row);$('notice').textContent=error?'تعذر الحفظ. تحقق من البيانات والصلاحيات.':'تم الحفظ بنجاح';if(!error){e.target.reset();await account()}}finally{b.disabled=false}}
$('shop').onsubmit=e=>{e.preventDefault();if(user)submit(e,'marketplace_shops',{owner_id:user.id,shop_name:$('shopName').value.trim(),country:$('shopCountry').value.trim(),city:$('city').value.trim(),contact_phone:$('phone').value.trim(),description:$('shopDesc').value.trim(),status:'pending'})};
$('product').onsubmit=e=>{e.preventDefault();const s=own.filter(s=>s.status==='approved');if(user&&s.length===1)submit(e,'marketplace_products',{shop_id:s[0].id,title:$('title').value.trim(),category:$('type').value,price:Number($('price').value),currency:$('currency').value,description:$('description').value.trim(),status:'draft'})};
for(const id of ['search','country','category'])$(id).addEventListener('input',render);
if(window.supabase){db=window.supabase.createClient('https://dagjfsqnfrzcmtjqmypy.supabase.co','sb_publishable_Ca6rTp5OS9IxNJ0jnnaYvQ_lNRanlDK');catalog();account()}else $('count').textContent='الاتصال غير متاح';
</script></body></html>
