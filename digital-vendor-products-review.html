<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة منتجات البائعين | GLOBAL ENERGY</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font:15px Tahoma,Arial;line-height:1.8}header{background:#17243a;padding:16px;border-bottom:2px solid #35c9a0}main{max-width:1050px;margin:auto;padding:20px}h1,h2,a{color:#35c9a0}.muted{color:#c9d5e2}.card{background:#1b2a40;border:1px solid #3d516b;border-radius:12px;padding:18px;margin:12px 0}button{background:#35c9a0;color:#101827;padding:9px 13px;border:0;border-radius:8px;cursor:pointer;font:inherit;font-weight:bold;margin:4px}button:disabled{opacity:.5}.row{display:flex;flex-wrap:wrap;gap:8px}.error{color:#ffb8b8}</style></head><body><header><strong>GLOBAL ENERGY & TECHNOLOGY</strong> · <a href="sections.html">الأقسام</a> · <a href="digital-vendor-review.html">طلبات انضمام الموردين</a></header><main><h1>مراجعة مقترحات الاشتراكات</h1><p class="muted">للمدير المخوّل فقط. الموافقة على المقترح لا تنشره تلقائياً في السوق ولا تتيح تسليم الأكواد.</p><p id="notice" role="status">جارٍ التحقق من الصلاحية...</p><div id="items"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://dagjfsqnfrzcmtjqmypy.supabase.co','sb_publishable_Ca6rTp5OS9IxNJ0jnnaYvQ_lNRanlDK');const $=id=>document.getElementById(id);const statuses={pending:'قيد المراجعة',approved:'موافق عليه',rejected:'مرفوض',suspended:'معلق'};function add(parent,k,v){const p=document.createElement('p');p.textContent=k+': '+(v??'—');parent.append(p)}async function load(){const {data:{user}}=await db.auth.getUser();if(!user){$('notice').innerHTML='يرجى <a href="login.html">تسجيل الدخول</a> بحساب إداري.';return}const {data,error}=await db.rpc('digital_vendor_product_review_queue');if(error){$('notice').textContent='الحساب غير مخوّل للمراجعة، أو تعذر جلب الطلبات.';return}$('notice').textContent='عدد المقترحات: '+data.length;$('items').replaceChildren();for(const item of data){const card=document.createElement('article');card.className='card';add(card,'التطبيق',item.app_name);add(card,'المنتج',item.title);add(card,'المدة',item.duration_days===1?'تجربة 24 ساعة':item.duration_days===365?'سنة':item.duration_days===1825?'5 سنوات':item.duration_days+' يوم');add(card,'سعر البيع بالدولار',item.retail_price_usd);add(card,'سعر الجملة بالدولار',item.wholesale_price_usd);add(card,'الحالة',statuses[item.status]||item.status);const row=document.createElement('div');row.className='row';for(const [decision,label] of [['approved','موافقة على المقترح'],['rejected','رفض'],['suspended','تعليق']]){const btn=document.createElement('button');btn.textContent=label;btn.addEventListener('click',async()=>{if(!confirm('تأكيد القرار: '+label+'؟'))return;btn.disabled=true;const {error}=await db.rpc('digital_vendor_review_product',{p_product_id:item.id,p_decision:decision});if(error){alert('تعذر الحفظ: '+error.message);btn.disabled=false}else await load()});row.append(btn)}card.append(row);$('items').append(card)}}load();</script></body></html>
