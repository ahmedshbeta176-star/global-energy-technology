<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>انضمام أصحاب التطبيقات | GLOBAL ENERGY</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font:15px Tahoma,Arial;line-height:1.8}header{background:#17243a;padding:16px;border-bottom:2px solid #35c9a0}main{max-width:860px;margin:auto;padding:20px}h1,h2,a{color:#35c9a0}.panel{background:#1b2b40;border:1px solid #3a4b63;border-radius:12px;padding:20px;margin:15px 0}label{display:block;margin:12px 0}input,textarea,select{width:100%;background:#0f1b2b;border:1px solid #60738b;color:white;border-radius:8px;padding:11px;font:inherit}button{background:#35c9a0;border:0;border-radius:8px;padding:11px 18px;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.muted{color:#cbd4e0}.error{color:#ffb9b9}.ok{color:#9deccf}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:13px}article{overflow-wrap:anywhere}</style></head><body><header><strong>GLOBAL ENERGY & TECHNOLOGY</strong> · <a href="sections.html">الأقسام</a> · <a href="digital-market.html">السوق الرقمي</a></header><main><h1>طلب انضمام صاحب تطبيق رقمي</h1><p class="muted">قدّم طلبك لمراجعة إدراج تطبيقك في السوق. لا يعني إرسال الطلب قبولاً أو تفعيل البيع. يُسمح فقط بالخدمات التي تملك حق توزيعها بصورة قانونية.</p><section class="panel"><p id="auth" class="muted">جارٍ فحص تسجيل الدخول...</p><form id="form" hidden><label>اسم الشركة أو المورد<input id="company" required minlength="2" maxlength="150"></label><label>اسم التطبيق<input id="app" required minlength="2" maxlength="150"></label><label>رابط شعار التطبيق (اختياري)<input id="logo" type="url" placeholder="https://..."></label><label>رمز الدولة (اختياري)<input id="country" maxlength="2" placeholder="PS"></label><label>بريد التواصل<input id="email" type="email" required></label><label>إثبات حق توزيع الاشتراكات أو الأكواد<textarea id="proof" rows="4" required minlength="10" maxlength="3000" placeholder="اشرح نوع الترخيص أو التفويض وكيف يمكن التحقق منه. لا ترسل كلمات مرور أو مفاتيح سرية."></textarea></label><button id="send" type="submit">إرسال للمراجعة</button></form><p id="notice" role="status"></p></section><section class="panel"><h2>طلباتي</h2><div id="mine" class="muted">تظهر بعد تسجيل الدخول</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient("https://dagjfsqnfrzcmtjqmypy.supabase.co","sb_publishable_Ca6rTp5OS9IxNJ0jnnaYvQ_lNRanlDK");</script><script>const $=id=>document.getElementById(id);const statuses={pending:'قيد المراجعة',needs_changes:'مطلوب تعديل',approved:'مقبول مبدئياً',rejected:'مرفوض',suspended:'معلق'};const safe=t=>{const e=document.createElement('span');e.textContent=t??'';return e.innerHTML};let user;async function refresh(){const {data:{user:u},error}=await db.auth.getUser();user=u;if(!u){$('auth').innerHTML='يجب <a href="login.html">تسجيل الدخول</a> قبل تقديم الطلب.';return}$('auth').textContent='مسجّل الدخول: '+(u.email||'حساب المستخدم');$('form').hidden=false;const {data,error:e}=await db.from('digital_vendor_applications').select('app_name,company_name,status,created_at,review_notes').order('created_at',{ascending:false}).limit(30);$('mine').textContent=e?'تعذر تحميل الطلبات: '+e.message:!data.length?'لم ترسل طلبات بعد':'';if(data)for(const item of data){const p=document.createElement('p');p.textContent=item.app_name+' — '+(statuses[item.status]||item.status)+(item.review_notes?' — '+item.review_notes:'');$('mine').append(p)}}$('form').addEventListener('submit',async e=>{e.preventDefault();if(!user)return;$('send').disabled=true;$('notice').textContent='جارٍ إرسال الطلب...';const payload={applicant_user_id:user.id,company_name:$('company').value.trim(),app_name:$('app').value.trim(),logo_url:$('logo').value.trim()||null,country_code:$('country').value.trim().toUpperCase()||null,contact_email:$('email').value.trim(),authorization_evidence:$('proof').value.trim()};const {error}=await db.from('digital_vendor_applications').insert(payload);$('notice').className=error?'error':'ok';$('notice').textContent=error?'تعذر إرسال الطلب: '+error.message:'تم إرسال طلبك للمراجعة. لن يظهر التطبيق في السوق قبل الموافقة.';if(!error){$('form').reset();$('mine').replaceChildren();await refresh()}$('send').disabled=false});refresh();</script></body></html>
